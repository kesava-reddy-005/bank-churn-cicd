```yaml
name: Build Test and Publish Bank Churn API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set GHCR image name
        shell: bash
        run: |
          IMAGE_ID="ghcr.io/${GITHUB_REPOSITORY_OWNER}/bank-churn-api"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t bank-churn-api:ci .

      - name: Start test container
        run: |
          docker run -d \
            --name bank-churn-ci \
            -p 8000:8000 \
            bank-churn-api:ci

      - name: Test API health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Health check passed."
              exit 0
            fi

            echo "Waiting for API... attempt $attempt/30"
            sleep 2
          done

          echo "Health check failed."
          docker logs bank-churn-ci
          exit 1

      - name: Test API root endpoint
        run: curl --fail --show-error http://localhost:8000/

      - name: Remove test container
        if: always()
        run: docker rm -f bank-churn-ci || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag tested Docker image
        run: |
          docker tag bank-churn-api:ci "$IMAGE_ID:latest"
          docker tag bank-churn-api:ci "$IMAGE_ID:sha-${GITHUB_SHA}"

      - name: Push Docker image to GHCR
        run: |
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:sha-${GITHUB_SHA}"
```
